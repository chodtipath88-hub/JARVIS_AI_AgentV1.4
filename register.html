<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครสมาชิก - JARVIS</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg,#0f172a,#1e293b); color: #e2e8f0; margin:0; display:flex; align-items:center; justify-content:center; height:100vh; }
    .card { background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:16px; width: 360px; padding:24px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin:0 0 16px; color:#94a3b8; }
    .input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color:#fff; outline:none; margin:8px 0; }
    .btn { width:100%; padding:12px 16px; border-radius:10px; border:none; cursor:pointer; background: linear-gradient(45deg,#10b981,#16a34a); color:#fff; font-weight:600; margin-top:10px; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .error { color:#fca5a5; min-height:20px; margin-top:8px; font-size: 14px; }
    .link { display:block; text-align:center; color:#93c5fd; text-decoration: underline; margin-top:12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>สร้างบัญชีใหม่</h1>
    <p>เข้าร่วมใช้งาน JARVIS AI</p>
    <div>
      <input id="u" class="input" placeholder="ชื่อผู้ใช้" />
      <input id="p" type="password" class="input" placeholder="รหัสผ่าน" />
      <input id="e" type="email" class="input" placeholder="อีเมล (ไม่บังคับ)" />
      <button id="reg" class="btn">สมัครสมาชิก</button>
      <div id="err" class="error"></div>
      <a class="link" href="/">กลับไปหน้าเข้าสู่ระบบ</a>
    </div>
  </div>
  <script>
    const btn = document.getElementById('reg');
    const err = document.getElementById('err');
    btn.addEventListener('click', async ()=>{
      const username = document.getElementById('u').value.trim();
      const password = document.getElementById('p').value.trim();
      const email = document.getElementById('e').value.trim();
      if(!username || !password){ err.textContent='กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'; return; }
      btn.disabled = true; btn.textContent = 'กำลังสมัคร...'; err.textContent = '';
      try{
        const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password, email }) });
        const out = await res.json();
        if(out.success){
          location.href = '/';
        } else {
          err.textContent = out.message || 'สมัครสมาชิกไม่สำเร็จ';
        }
      } catch(e){ err.textContent = 'ไม่สามารถเชื่อมต่อได้ กรุณาลองใหม่'; }
      finally{ btn.disabled = false; btn.textContent='สมัครสมาชิก'; }
    });
  </script>
</body>
</html>
