<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JARVIS AI Chat</title>
  <!-- ✅ แก้ URL ให้ไม่มีช่องว่าง -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
   
    body {
      font-family: 'Kanit', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    .chat-container {
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    /* Glassmorphism effect */
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.1);
    }

    .message-bubble {
      max-width: 75%;
      word-break: break-word;
      animation: fadeInUp 0.25s ease-out;
      position: relative;
    }

    .user-message {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai-message {
      background: rgba(55, 65, 81, 0.8);
      color: white;
      border-bottom-left-radius: 4px;
    }

    .image-msg img {
      max-width: 200px;
      border-radius: 12px;
      margin-top: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .image-msg img:hover {
      transform: scale(1.02);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #60a5fa;
      animation: typing 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 768px) {
      .chat-container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: fixed;
        left: -320px;
        width: 320px;
        height: 100vh;
        z-index: 50;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        transform: translateX(0);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar.closed {
        transform: translateX(-100%);
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 40;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
      }
      .overlay.visible {
        opacity: 1;
        visibility: visible;
      }
    }
  </style>
</head>
<body class="text-white overflow-hidden">
  <div class="chat-container">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar glass flex flex-col border-r border-slate-700/50 transition-transform duration-300">
      <!-- User Header -->
      <div class="p-4 border-b border-slate-700/30">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center shadow-lg">
              <i class="fas fa-user text-white text-sm"></i>
            </div>
            <div>
              <h3 id="currentUserName" class="font-semibold text-white truncate max-w-[140px]">ผู้ใช้</h3>
              <div class="flex items-center space-x-1 mt-1">
                <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                <span class="text-xs text-slate-400">ออนไลน์</span>
              </div>
            </div>
          </div>
          <button id="userMenuBtn" class="p-2 hover:bg-slate-700/50 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">
            <i class="fas fa-cog text-slate-400"></i>
          </button>
        </div>
      </div>

      <!-- Search & New Chat -->
      <div class="p-4 space-y-3">
        <button id="newChatBtn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-xl font-medium transition-all flex items-center justify-center space-x-2 shadow-md hover:shadow-lg">
          <i class="fas fa-plus"></i>
          <span>แชทใหม่</span>
        </button>
       
        <div class="relative">
          <i class="fas fa-search absolute left-3 top-3 text-slate-400"></i>
          <input type="text" id="searchChat" placeholder="ค้นหาบทสนทนา..."
                 class="w-full pl-10 pr-4 py-2.5 bg-slate-800/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-white placeholder-slate-400">
        </div>
      </div>

      <!-- Conversations List -->
      <div class="flex-1 overflow-y-auto px-2 pb-2">
        <div class="px-2 py-2">
          <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">บทสนทนาล่าสุด</h4>
        </div>
        <div id="conversationsList" class="space-y-1.5">
          <!-- Conversations will be loaded here -->
        </div>
      </div>

      <!-- Footer -->
      <div class="p-4 border-t border-slate-700/30">
        <button id="logoutBtn" class="w-full py-2.5 text-sm text-slate-400 hover:text-red-400 transition-colors flex items-center justify-center space-x-2 group">
          <i class="fas fa-sign-out-alt group-hover:-translate-x-1 transition-transform"></i>
          <span>ออกจากระบบ</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex flex-col">
      <!-- Header -->
      <header class="p-4 glass border-b border-slate-700/30">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <button id="mobileSidebarBtn" class="md:hidden p-2 hover:bg-slate-700/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
              <i class="fas fa-bars text-slate-300"></i>
            </button>
            <div>
              <h2 id="currentChatTitle" class="text-lg font-semibold text-white truncate max-w-[200px] md:max-w-none">เลือกหรือสร้างบทสนทนา</h2>
              <p id="currentChatInfo" class="text-sm text-slate-400">เริ่มแชทใหม่เพื่อพูดคุยกับ JARVIS</p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <button id="exportBtn" class="p-2 hover:bg-slate-700/50 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500" title="ส่งออก">
              <i class="fas fa-file-export text-slate-400"></i>
            </button>
            <button id="chatMenuBtn" class="p-2 hover:bg-slate-700/50 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">
              <i class="fas fa-ellipsis-v text-slate-400"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Messages -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-thin scrollbar-thumb-slate-700 scrollbar-track-transparent">
        <div id="welcomeMessage" class="text-center py-16 px-4">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 mb-4 shadow-lg">
            <i class="fas fa-robot text-2xl text-white"></i>
          </div>
          <h3 class="text-xl font-semibold text-white mb-2">ยินดีต้อนรับสู่ JARVIS AI</h3>
          <p class="text-slate-400 max-w-md mx-auto leading-relaxed">
            เริ่มบทสนทนาใหม่หรือเลือกบทสนทนาที่มีอยู่เพื่อพูดคุยกับผู้ช่วย AI ส่วนตัวของคุณ
          </p>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div id="typingIndicator" class="hidden px-4 py-2">
        <div class="ai-message message-bubble rounded-2xl px-4 py-3">
          <div class="typing-indicator">
            <span class="text-slate-300">JARVIS กำลังพิมพ์</span>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>

      <!-- Input -->
      <footer class="p-4 glass border-t border-slate-700/30">
        <div class="flex items-end space-x-2">
          <label class="p-3 text-slate-400 hover:text-cyan-400 hover:bg-slate-700/50 rounded-lg cursor-pointer transition-colors focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <i class="fas fa-image"></i>
            <input type="file" id="imageUpload" accept="image/*" class="hidden" />
          </label>
         
          <div class="flex-1 relative">
            <textarea id="messageInput"
                      placeholder="พิมพ์ข้อความ... (Shift+Enter = ขึ้นบรรทัดใหม่)"
                      rows="1"
                      class="w-full p-3 bg-slate-800/50 border border-slate-700 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-white placeholder-slate-400"
                      style="min-height: 48px; max-height: 140px;"></textarea>
           
            <button id="sendBtn"
                    disabled
                    class="absolute right-2 bottom-2 p-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-blue-500">
              <i class="fas fa-paper-plane text-white"></i>
            </button>
          </div>
        </div>
       
        <div class="mt-2 text-xs text-slate-500 text-center">
          พิมพ์ <kbd class="bg-slate-700 px-1.5 py-0.5 rounded">Enter</kbd> เพื่อส่ง
        </div>
      </footer>
    </main>
  </div>

  <!-- Overlay -->
  <div id="overlay" class="overlay"></div>

  <!-- Chat Menu -->
  <div id="chatMenu" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-slate-800/90 backdrop-blur-lg rounded-2xl p-5 w-full max-w-sm border border-slate-700/50">
      <h3 class="text-lg font-semibold text-white mb-4 flex items-center">
        <i class="fas fa-robot text-blue-400 mr-2"></i>
        ตัวเลือกบทสนทนา
      </h3>
      <div class="space-y-2">
        <button id="renameChatBtn" class="w-full text-left px-4 py-3 hover:bg-slate-700/70 rounded-xl transition-colors flex items-center space-x-3">
          <i class="fas fa-edit text-slate-400"></i>
          <span>เปลี่ยนชื่อบทสนทนา</span>
        </button>
        <button id="copyAllBtn" class="w-full text-left px-4 py-3 hover:bg-slate-700/70 rounded-xl transition-colors flex items-center space-x-3">
          <i class="fas fa-copy text-slate-400"></i>
          <span>คัดลอกทั้งหมด</span>
        </button>
        <button id="exportPdfBtn" class="w-full text-left px-4 py-3 hover:bg-slate-700/70 rounded-xl transition-colors flex items-center space-x-3">
          <i class="fas fa-file-pdf text-red-400"></i>
          <span>ส่งออกเป็น PDF</span>
        </button>
        <hr class="border-slate-700 my-2">
        <button id="deleteChatBtn" class="w-full text-left px-4 py-3 hover:bg-red-600/70 rounded-xl transition-colors flex items-center space-x-3 text-red-400">
          <i class="fas fa-trash"></i>
          <span>ลบบทสนทนา</span>
        </button>
        <button id="closeChatMenuBtn" class="w-full text-left px-4 py-3 hover:bg-slate-700/70 rounded-xl transition-colors flex items-center space-x-3">
          <i class="fas fa-times text-slate-400"></i>
          <span>ปิด</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ... (โค้ด JavaScript เดิมของคุณ — ไม่ต้องเปลี่ยน)
    // เพียงเพิ่มฟังก์ชัน export/copy ตามที่ให้ไว้ในคำตอบก่อนหน้า
  </script>
</body>
</html>
